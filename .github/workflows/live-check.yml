# Post-deploy check: opens the live site read-only in Chrome at desktop and
# phone sizes after each Production deploy, and files an issue if it fails.
name: Live site check

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: URL to check
        default: https://wingspanscoresheet.vercel.app/

permissions:
  contents: read

concurrency:
  group: live-check
  cancel-in-progress: false

jobs:
  check:
    name: Check live site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run read-only live check
        env:
          LIVE_URL: ${{ inputs.url || 'https://wingspanscoresheet.vercel.app/' }}
        run: node scripts/live-check.mjs

  notify:
    name: File an issue when live check fails
    needs: [check]
    if: always() && !cancelled() && needs.check.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Create or update the live-check-alert issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Live site check is failing"
          body=$(printf '%s\n' \
            "**Run:** $RUN_URL" \
            "**Commit:** $SHA" \
            "**Site:** https://wingspanscoresheet.vercel.app/" \
            "" \
            "The post-deploy read-only check failed on the live site. Investigate and close this issue once a new check passes." \
            "" \
            "_Filed automatically by the Live site check workflow._")
          gh label create live-check-alert --repo "$REPO" --color B60205 \
            --description "Automated alert from a failed post-deploy live check" --force || true
          existing=$(TITLE="$title" gh issue list --repo "$REPO" --state open \
            --label live-check-alert --limit 100 --json number,title \
            --jq 'map(select(.title == env.TITLE)) | .[0].number // empty' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --label live-check-alert --body "$body" \
              || gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi
